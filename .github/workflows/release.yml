name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to publish
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
    steps:
      - name: Validate canonical release tag
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*))?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "Release tag must use the canonical v<semver> tag format" >&2
            exit 1
          fi
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          package-manager-cache: false
          registry-url: https://registry.npmjs.org
          scope: '@matiasnjacob'
      - name: Verify npm supports Trusted Publishing
        run: |
          NPM_VERSION="$(npm --version)"
          node -e 'const [major, minor, patch] = process.argv[1].split(".").map(Number); if (major < 11 || (major === 11 && (minor < 5 || (minor === 5 && patch < 1)))) { console.error(`npm ${process.argv[1]} is below required 11.5.1`); process.exit(1); }' "$NPM_VERSION"
      - name: Install locked dependencies
        run: npm ci
      - name: Verify release tag matches package version
        run: |
          TAG_VERSION="${RELEASE_TAG#v}"
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "Release tag v$TAG_VERSION does not match package version $PACKAGE_VERSION" >&2
            exit 1
          fi
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Run tests
        run: npm test
      - name: Package release asset
        id: package_release_asset
        run: |
          mkdir -p release
          PACKAGE=$(npm pack --silent --pack-destination release)
          (cd release && sha256sum "$PACKAGE" > SHA256SUMS)
          echo "package=$PACKAGE" >> "$GITHUB_OUTPUT"
      - name: Smoke test packaged CLI
        run: node scripts/smoke-package.mjs "./release/${{ steps.package_release_asset.outputs.package }}"
      - name: Attest release tarball
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: release/*.tgz
      - name: Publish scoped package to npm
        run: npm publish "./release/${{ steps.package_release_asset.outputs.package }}" --access public
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$RELEASE_TAG" release/* --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --title "$RELEASE_TAG"
